name: Flow Validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  flow-server-javadoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.7
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build flow-server with Javadoc
        run: |
          set -x
          LOG=mvn-flow-server.out
          mvn -B -ntp -T 2C -DskipTests -am -pl flow-server install -Dmaven.javadoc.skip=false </dev/null >"$LOG" 2>&1 &
          MVN_PID=$!
          tail -f --pid=$MVN_PID "$LOG" &
          wait $MVN_PID
      - name: Surface Javadoc errors
        if: ${{ failure() }}
        run: |
          LOG=mvn-flow-server.out
          if [ -f "$LOG" ] && grep -qE '\.java:[0-9]+: error:' "$LOG"; then
            {
              echo ""
              echo "### Javadoc errors"
              echo ""
              echo '```'
              grep -E '\.java:[0-9]+: error:' -A 2 "$LOG" | sed 's/^\[ERROR\] //'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: mvn-log
          path: mvn-flow-server.out
